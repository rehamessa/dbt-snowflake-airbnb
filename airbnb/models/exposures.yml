version: 2

exposures:
  - name: airbnb_powerbi_report
    label: "Airbnb: Market & Guest Experience (Power BI)"
    type: dashboard
    maturity: high
    url: https://github.com/rehamessa/dbt-snowflake-airbnb/tree/main/PBI
    description: >
      Three-page Power BI report built on the tested dbt models.
      Overview: reviews, guest satisfaction, listings, prices and hosts over time.
      Hosts & Pricing: top hosts, market concentration (Lorenz curve) and pricing by host status and size.
      Pipeline Health: results of the last dbt build (tests, warnings, build timeline) from run_results.json.
    depends_on:
      - ref('mart_fullmoon_reviews')
      - ref('dim_listings_w_hosts')
      - ref('int_host_performance')
    owner:
      name: Reham Essa
